<div class="chat-interface">
  <!-- Estado de bienvenida: sin provider seleccionado -->
  <div *ngIf="!(selectedProvider$ | async)" class="empty-chat">
    <mat-icon class="empty-chat-icon">chat</mat-icon>
    <h2 class="empty-chat-title">Bienvenido al Chat</h2>
    <p class="empty-chat-subtitle">Selecciona un proveedor para comenzar a conversar.</p>
  </div>

  <!-- Chat activo: provider seleccionado -->
  <ng-container *ngIf="selectedProvider$ | async as selectedProvider">
    <!-- Header del Chat -->
    <div class="chat-header">
      <div class="provider-info">
        <img
          [src]="selectedProvider.foto"
          [alt]="selectedProvider.contactName"
          class="provider-avatar">
        <h2 class="provider-name">{{ selectedProvider.nombre }}</h2>
      </div>
    </div>

    <!-- Área de Mensajes -->
    <div class="messages-container" #messagesContainer>
      <!-- Estado de carga de conversación -->
      <div *ngIf="!(conversation$ | async)" class="loading-state">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Cargando conversación...</p>
      </div>

      <!-- Conversación cargada -->
      <ng-container *ngIf="conversation$ | async as conversation">
        <!-- Sin mensajes -->
        <div *ngIf="conversation.messages.length === 0" class="empty-chat">
          <mat-icon class="empty-chat-icon">forum</mat-icon>
          <p>No hay mensajes aún. ¡Inicia la conversación!</p>
        </div>

        <!-- Lista de mensajes -->
        <div *ngFor="let message of conversation.messages; trackBy: trackByMessageId">
          <app-chat-message
            [message]="message"
            [isOwn]="isOwnMessage(message)"
            [animationClass]="getAnimationClass()">
          </app-chat-message>
        </div>
      </ng-container>

      <!-- Referencia para scroll automático -->
      <div #messagesEnd></div>
    </div>

    <!-- Botón flotante para scroll to bottom -->
    <button
      *ngIf="showScrollButton"
      mat-fab
      color="primary"
      class="scroll-to-bottom"
      (click)="onScrollToBottom()"
      aria-label="Ir al final">
      <mat-icon>arrow_downward</mat-icon>
    </button>

    <!-- Área de Input -->
    <div class="chat-input-area">
      <app-chat-input
        [disabled]="isLoading"
        (sendMessage)="onSendMessage($event)">
      </app-chat-input>
    </div>
  </ng-container>
</div>
