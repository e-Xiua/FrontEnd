<section class="networking-card" aria-labelledby="networking-card-title">
  <header class="networking-card__header">
    <div class="networking-card__icon" aria-hidden="true">
      🤝
    </div>
    <div>
      <h2 class="networking-card__title" id="networking-card-title">Construye tu red</h2>
      <p class="networking-card__subtitle">Conecta con turistas y otros proveedores para nuevas oportunidades.</p>
    </div>
  </header>

  <ul class="networking-card__list">
    <li>Responde a tus mensajes pendientes</li>
    <li>Explora proveedores afines para alianzas</li>
    <li>Destaca tus servicios más recientes</li>
  </ul>

  <button type="button" class="networking-card__button" (click)="onConnect()">
    Abrir panel de networking
  </button>
</section>
