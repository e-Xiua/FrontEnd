<div class="messages-root">
  <div class="messages-list" *ngIf="messages$ | async as messages">
    <div *ngFor="let m of messages" class="bubble" [ngClass]="{'mine': false}">
      <div class="meta">{{ m.senderName || 'Usuario' }} · {{ m.createdAt | date:'short' }}</div>
      <div class="content">{{ m.content }}</div>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="send()" class="send-form">
    <mat-form-field appearance="outline" class="full">
      <input matInput placeholder="Escribe un mensaje" formControlName="content" />
    </mat-form-field>
    <button mat-flat-button color="primary" type="submit">Enviar</button>
  </form>
</div>
