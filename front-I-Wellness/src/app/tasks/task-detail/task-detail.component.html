<div class="task-detail" *ngIf="task$ | async as task">
  <mat-card>
    <mat-card-title>{{ task.title }}</mat-card-title>
    <mat-card-subtitle>{{ task.responsibleName || 'Sin responsable' }}</mat-card-subtitle>
    <mat-card-content>
      <p>{{ task.description }}</p>
      <p><strong>Due:</strong> {{ task.dueDate | date }}</p>
      <p><strong>Status:</strong> {{ task.status }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button color="primary" [routerLink]="['/tasks/edit', task.id]">Editar</button>
    </mat-card-actions>
  </mat-card>

  <app-message-panel [taskId]="task.id"></app-message-panel>
</div>
