<div
  class="modal-container"
  [@slideToggle]="modalState"
  [class.visible]="isVisible"
  [class.minimized]="isMinimized">

  <!-- Modal Header -->
  <div class="modal-header" (click)="onMinimizeModal()" (keydown)="onMinimizeModal()">
    <h3 class="modal-title">
      <mat-icon>{{ getTabIcon(activeTab) }}</mat-icon>
      {{ modalTitle }}
    </h3>

    <div class="header-controls">
      <button
        mat-icon-button
        (click)="onMinimizeModal(); $event.stopPropagation()"
        [attr.aria-label]="isMinimized ? 'Expandir chat' : 'Minimizar chat'">
        <mat-icon>{{ isMinimized ? 'expand_less' : 'expand_more' }}</mat-icon>
      </button>

      <button
        mat-icon-button
        (click)="onCloseModal(); $event.stopPropagation()"
        [attr.aria-label]="'Cerrar modal'">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <!-- Modal Content -->
  <div class="modal-content" *ngIf="showContent">
    <mat-tab-group
      [selectedIndex]="selectedTabIndex"
      (selectedTabChange)="onTabChange(tabIndexToModalTab($event.index))"
      animationDuration="200ms">

      <!-- Conversations Tab -->
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon>forum</mat-icon>
          <span>Conversaciones</span>
        </ng-template>

        <div class="tab-content">
          <!-- Loading State -->
          <div *ngIf="(layoutState$ | async)?.isLoading" class="loading-state">
            <mat-spinner diameter="40"></mat-spinner>
            <p>Cargando conversaciones...</p>
          </div>

          <!-- Empty State -->
          <div *ngIf="!(layoutState$ | async)?.isLoading && ((paginatedMessages$ | async)?.items?.length || 0) === 0" class="empty-state">
            <mat-icon class="empty-icon">chat_bubble_outline</mat-icon>
            <p>No hay conversaciones activas.</p>
          </div>

          <!-- Conversations List -->
          <div *ngIf="!(layoutState$ | async)?.isLoading && ((paginatedMessages$ | async)?.items?.length || 0) > 0" class="conversations-list">
            <button
              *ngFor="let conversation of (paginatedMessages$ | async)?.items; trackBy: trackByConversation"
              type="button"
              class="conversation-item"
              (click)="onConversationSelect(conversation)"
              aria-label="Seleccionar conversación">

              <img
                [src]="conversation.participant?.foto || conversation.participant2?.foto || 'https://api.dicebear.com/7.x/avataaars/svg?seed=provider' + conversation.providerId"
                [alt]="conversation.participant?.nombre || conversation.participant2?.nombre || 'Proveedor'"
                class="conversation-avatar">

              <div class="conversation-info">
                <h4 class="conversation-name">{{ conversation.participant?.nombre || conversation.participant2?.nombre || 'Proveedor #' + conversation.providerId }}</h4>
                <p class="last-message">{{ conversation.lastMessage?.content || 'Sin mensajes' }}</p>
              </div>

              <div class="conversation-meta">
                <span class="timestamp">{{ conversation.lastMessage?.timestamp | date:'short' }}</span>
                <span *ngIf="(conversation?.unreadCount || 0) > 0" class="unread-count">{{ conversation.unreadCount }}</span>
              </div>
            </button>
          </div>

          <!-- Pagination -->
          <div *ngIf="((paginatedMessages$ | async)?.totalItems || 0) > ((paginatedMessages$ | async)?.pageSize || 10)" class="pagination-section">
            <mat-paginator
              [length]="(paginatedMessages$ | async)?.totalItems || 0"
              [pageSize]="(paginatedMessages$ | async)?.pageSize || 10"
              [pageIndex]="((paginatedMessages$ | async)?.currentPage || 1) - 1"
              (page)="onMessagesPageChange($event)">
            </mat-paginator>
          </div>
        </div>
      </mat-tab>

      <!-- Active Chat Tab -->
      <mat-tab [disabled]="!hasSelectedProvider">
        <ng-template mat-tab-label>
          <mat-icon>chat</mat-icon>
          <span>Chat Activo</span>
        </ng-template>

        <div class="tab-content">
          <div *ngIf="hasSelectedProvider" class="chat-interface-container">
            <div class="back-button-container">
              <button mat-stroked-button (click)="onBackToConversations()">
                <mat-icon>arrow_back</mat-icon>
                Volver
              </button>
            </div>
            <app-chat-interface></app-chat-interface>
          </div>

          <!-- Placeholder -->
          <div *ngIf="!hasSelectedProvider" class="empty-state">
            <mat-icon class="empty-icon">question_answer</mat-icon>
            <p>Selecciona una conversación para ver los mensajes.</p>
          </div>
        </div>
      </mat-tab>
    </mat-tab-group>
  </div>

  <!-- Toggle Button (when hidden) -->
  <button
    *ngIf="!isVisible"
    mat-fab
    color="primary"
    class="toggle-button"
    (click)="onToggleModal()"
    [attr.aria-label]="'Abrir chat'">
    <mat-icon>chat</mat-icon>
  </button>
</div>
