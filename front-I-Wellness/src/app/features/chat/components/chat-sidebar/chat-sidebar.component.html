<div
  class="chat-sidebar"
  [class.visible]="(layoutState$ | async)?.sidebarVisible"
  [attr.aria-hidden]="!((layoutState$ | async)?.sidebarVisible)"
>
  <header class="sidebar-header">
    <button mat-icon-button (click)="onToggleSidebar()">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <h2>Contactos</h2>
    <button
      mat-icon-button
      (click)="onRefresh()"
      [disabled]="(isLoading$ | async) ?? false"
      aria-label="Actualizar contactos"
    >
      <mat-icon>refresh</mat-icon>
    </button>
  </header>

  <section class="filters">
    <mat-form-field appearance="outline">
      <mat-label>Buscar</mat-label>
      <input
        matInput
        [formControl]="searchControl"
        placeholder="Proveedor, contacto o servicio"
      />
      <button mat-icon-button matSuffix *ngIf="searchControl.value" (click)="onClearSearch()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Ordenar por</mat-label>
      <mat-select [formControl]="sortControl">
        <mat-option *ngFor="let option of sortOptions" [value]="option.value">
          {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Filtrar</mat-label>
      <mat-select [formControl]="filterControl">
        <mat-option *ngFor="let option of filterOptions" [value]="option.value">
          {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </section>

  <ng-container *ngIf="(isLoading$ | async); else sidebarContent">
    <div class="loading-container">
      <mat-progress-spinner diameter="48" mode="indeterminate"></mat-progress-spinner>
      <p>Cargando contactos…</p>
    </div>
  </ng-container>

  <ng-template #sidebarContent>
    <div *ngIf="(error$ | async) as error" class="error-state">
      <p>{{ error }}</p>
      <button mat-button color="primary" (click)="onRefresh()">Reintentar</button>
    </div>

    <ng-container *ngIf="(paginatedProviders$ | async) as providers">
      <div class="empty-state" *ngIf="providers.length === 0">
        <p>No tienes contactos para mostrar.</p>
      </div>

      <div class="providers-list" *ngIf="providers.length > 0">
        <app-contact-card
          *ngFor="let provider of providers; let i = index; trackBy: trackByProvider"
          [provider]="provider"
          class="provider-card"
          [ngClass]="getAnimationClass(i)"
          tabindex="0"
          (click)="onProviderSelect(provider)"
          (keydown.enter)="onProviderSelect(provider)"
          (keydown.space)="onProviderSelect(provider)"
        ></app-contact-card>
      </div>

      <mat-paginator
        [length]="(totalProviders$ | async) ?? 0"
        [pageIndex]="(pageState$ | async)?.pageIndex ?? 0"
        [pageSize]="(pageState$ | async)?.pageSize ?? 10"
        [pageSizeOptions]="[5, 10, 20]"
        (page)="onPageChange($event)"
      ></mat-paginator>
    </ng-container>
  </ng-template>
</div>
